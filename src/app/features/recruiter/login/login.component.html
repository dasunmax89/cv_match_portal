<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl border border-[#D5EDED] p-8 shadow-xs">

    <!-- Badge Header -->
    <div class="text-center mb-8">
      <img src="logo.png" alt="Magic Match Logo" class="w-16 h-16 object-contain mx-auto mb-3" />
      <h2 class="text-2xl font-bold text-[#172B32] tracking-tight">
        Recruiter Sign In
      </h2>
      <p class="text-xs text-[#4E6770] mt-1">
        Access your active jobs, candidate matches, and JD parser
      </p>
    </div>

    @if (errorMessage) {
    <div
      class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center justify-between">
      <span>{{ errorMessage }}</span>
      <button (click)="errorMessage = ''" class="text-rose-500 hover:text-rose-700 font-bold ml-2">✕</button>
    </div>
    }

    <!-- Auth Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-[#172B32] uppercase tracking-wider mb-1">Work Email</label>
        <input type="email" [(ngModel)]="workEmail" name="workEmail" placeholder="recruiter@company.com" required
          class="w-full px-3.5 py-2.5 bg-[#F8FBFA] border border-[#D5EDED] rounded-xl text-sm text-[#172B32] placeholder-[#4E6770]/60 focus:outline-none focus:ring-2 focus:ring-[#71C9CE] focus:bg-white transition-all" />
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-[#172B32] uppercase tracking-wider">Password</label>
          <a routerLink="/recruiter/forgot-password" [queryParams]="workEmail ? { email: workEmail } : null" class="text-xs font-semibold text-[#244653] hover:text-[#71C9CE]">Forgot?</a>
        </div>

        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required
          class="w-full px-3.5 py-2.5 bg-[#F8FBFA] border border-[#D5EDED] rounded-xl text-sm text-[#172B32] placeholder-[#4E6770]/60 focus:outline-none focus:ring-2 focus:ring-[#71C9CE] focus:bg-white transition-all" />
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full py-2.5 px-4 bg-[#244653] hover:bg-[#1B353F] text-white font-semibold text-sm rounded-xl shadow-xs transition-colors mt-2 flex items-center justify-center cursor-pointer focus-visible:ring-2 focus-visible:ring-[#71C9CE]">
        @if (isLoading) {
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        Signing In...
        } @else {
        Sign In to Recruiter Workspace
        }
      </button>
    </form>

    <!-- SSO & Google Options -->
    <div class="mt-6 pt-4 border-t border-[#D5EDED] space-y-2.5">
      <button type="button" (click)="onGoogleSignIn()"
        class="w-full py-2.5 px-3 border border-[#D5EDED] rounded-xl text-xs font-semibold text-[#172B32] hover:bg-[#F8FBFA] hover:border-[#71C9CE] flex items-center justify-center transition-colors shadow-2xs cursor-pointer">
        <svg class="w-4 h-4 mr-2" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        Sign in with Google
      </button>

      <button type="button"
        class="w-full py-2.5 px-3 border border-[#D5EDED] rounded-xl text-xs font-semibold text-[#172B32] hover:bg-[#F8FBFA] hover:border-[#71C9CE] flex items-center justify-center transition-colors cursor-pointer">
        <svg class="w-4 h-4 mr-2 text-[#71C9CE]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.39-2.823-1.07-4" />
        </svg>
        Sign in with Enterprise SSO (Okta / Azure AD)
      </button>
    </div>

    <!-- Toggle Mode -->
    <div class="mt-6 text-center text-xs text-[#4E6770]">
      New hiring organization?
      <a routerLink="/recruiter/signup" class="font-bold text-[#244653] hover:text-[#71C9CE] ml-1">
        Register Workspace
      </a>
    </div>

  </div>
</div>
