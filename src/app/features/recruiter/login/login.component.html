<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">

    <!-- Badge Header -->
    <div class="text-center mb-8">
      <img src="logo.png" alt="Magic Match Logo" class="w-16 h-16 object-contain mx-auto mb-3" />
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">
        Recruiter Sign In
      </h2>
      <p class="text-xs text-slate-500 mt-1">
        Access your active jobs, candidate matches, and JD parser
      </p>
    </div>

    @if (errorMessage) {
    <div
      class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center justify-between">
      <span>{{ errorMessage }}</span>
      <button (click)="errorMessage = ''" class="text-rose-500 hover:text-rose-700 font-bold ml-2">✕</button>
    </div>
    }

    <!-- Auth Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Work Email</label>
        <input type="email" [(ngModel)]="workEmail" name="workEmail" placeholder="recruiter@company.com" required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all" />
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
          <a href="#" class="text-xs font-medium text-sky-600 hover:text-sky-700">Forgot?</a>
        </div>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all" />
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full py-2.5 px-4 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors mt-2 flex items-center justify-center">
        @if (isLoading) {
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        Signing In...
        } @else {
        Sign In to Recruiter Workspace
        }
      </button>
    </form>

    <!-- SSO Option -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <button type="button"
        class="w-full py-2 px-3 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center justify-center transition-colors">
        <svg class="w-4 h-4 mr-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.39-2.823-1.07-4" />
        </svg>
        Sign in with Enterprise SSO (Okta / Azure AD)
      </button>
    </div>

    <!-- Toggle Mode -->
    <div class="mt-6 text-center text-xs text-slate-600">
      New hiring organization?
      <a routerLink="/recruiter/signup" class="font-semibold text-sky-600 hover:underline ml-1">
        Register Workspace
      </a>
    </div>

  </div>
</div>
