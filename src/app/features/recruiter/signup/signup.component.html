<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
    
    <!-- Badge Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-sky-50 text-sky-600 font-bold text-xl mb-3 border border-sky-100">
        CV
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">
        Create Recruiter Account
      </h2>
      <p class="text-xs text-slate-500 mt-1">
        Set up your company workspace to automate candidate matching
      </p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center justify-between">
        <span>{{ errorMessage }}</span>
        <button (click)="errorMessage = ''" class="text-rose-500 hover:text-rose-700 font-bold ml-2">✕</button>
      </div>
    }

    <!-- Auth Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Company Name</label>
        <input 
          type="text" 
          [(ngModel)]="companyName" 
          name="companyName" 
          placeholder="e.g. Acme Tech Solutions"
          required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Work Email</label>
        <input 
          type="email" 
          [(ngModel)]="workEmail" 
          name="workEmail" 
          placeholder="recruiter@company.com"
          required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••"
          required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading"
        class="w-full py-2.5 px-4 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors mt-2 flex items-center justify-center"
      >
        @if (isLoading) {
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Creating Workspace...
        } @else {
          Create Workspace & Continue
        }
      </button>
    </form>

    <!-- Toggle Mode -->
    <div class="mt-6 text-center text-xs text-slate-600">
      Already registered your company?
      <a routerLink="/recruiter/login" class="font-semibold text-sky-600 hover:underline ml-1">
        Sign In
      </a>
    </div>

  </div>
</div>
