<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">

    <!-- Header -->
    <div class="text-center mb-8">
      <img src="logo.png" alt="Magic Match Logo" class="w-24 h-24 object-contain mx-auto mb-3" />
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Vendor Management Portal</h2>
      <p class="text-xs text-slate-500 mt-1">Authorized Super Admin access to manage recruiters and platform state</p>
    </div>

    @if (errorMessage) {
    <div
      class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center justify-between">
      <span>{{ errorMessage }}</span>
      <button (click)="errorMessage = ''" class="text-rose-500 hover:text-rose-700 font-bold ml-2">✕</button>
    </div>
    }

    <!-- Auth Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Admin Email / ID</label>
        <input type="email" [(ngModel)]="adminId" name="adminId" placeholder="admin@vendorcompany.com" required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">2FA Authenticator
          Code</label>
        <input type="text" [(ngModel)]="mfaCode" name="mfaCode" placeholder="6-digit code (e.g. 849204)" required
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 font-mono placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all" />
      </div>

      <button type="submit"
        class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors mt-2">
        Authenticate Admin Session
      </button>
    </form>

    <div class="mt-6 text-center text-[11px] text-slate-400 flex items-center justify-center space-x-1">
      <svg class="w-3.5 h-3.5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd"
          d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
          clip-rule="evenodd" />
      </svg>
      <span>256-bit Encrypted Admin Connection</span>
    </div>

  </div>
</div>
