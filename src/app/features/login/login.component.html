<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-badge">ML</div>
      <h2>{{ 'LOGIN_TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'LOGIN_SUBTITLE' | translate }}</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div *ngIf="errorMessage()" class="alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage() | translate }}</span>
      </div>

      <div class="form-group">
        <label for="email">{{ 'EMAIL_LABEL' | translate }}</label>
        <div class="input-with-icon">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input 
            id="email"
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            class="form-control" 
            placeholder="admin@example.com"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading()">
        <span *ngIf="!loading()">{{ 'LOGIN_BTN' | translate }}</span>
        <span *ngIf="loading()">{{ 'LOADING' | translate }}</span>
      </button>
    </form>
  </div>
</div>
