<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl border border-[#D5EDED] p-8 shadow-xs">

    <!-- Badge Header -->
    <div class="text-center mb-8">
      <img src="logo.png" alt="Magic Match Logo" class="w-16 h-16 object-contain mx-auto mb-3" />
      <h2 class="text-2xl font-bold text-[#172B32] tracking-tight">
        Welcome back
      </h2>
      <p class="text-xs text-[#4E6770] mt-1">
        Sign in to access your matched jobs and application status
      </p>
    </div>

    @if (errorMessage) {
    <div
      class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-center justify-between">
      <span>{{ errorMessage }}</span>
      <button (click)="errorMessage = ''" class="text-rose-500 hover:text-rose-700 font-bold ml-2">✕</button>
    </div>
    }

    <!-- Auth Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-[#172B32] uppercase tracking-wider mb-1">Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="alex@example.com" required
          class="w-full px-3.5 py-2.5 bg-[#F8FBFA] border border-[#D5EDED] rounded-xl text-sm text-[#172B32] placeholder-[#4E6770]/60 focus:outline-none focus:ring-2 focus:ring-[#71C9CE] focus:bg-white transition-all" />
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-[#172B32] uppercase tracking-wider">Password</label>
          <a routerLink="/candidate/forgot-password" [queryParams]="email ? { email: email } : null" class="text-xs font-semibold text-[#244653] hover:text-[#71C9CE]">Forgot?</a>
        </div>

        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required
          class="w-full px-3.5 py-2.5 bg-[#F8FBFA] border border-[#D5EDED] rounded-xl text-sm text-[#172B32] placeholder-[#4E6770]/60 focus:outline-none focus:ring-2 focus:ring-[#71C9CE] focus:bg-white transition-all" />
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full py-2.5 px-4 bg-[#244653] hover:bg-[#1B353F] text-white font-semibold text-sm rounded-xl shadow-xs transition-colors mt-2 flex items-center justify-center cursor-pointer focus-visible:ring-2 focus-visible:ring-[#71C9CE]">
        @if (isLoading) {
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        Signing In...
        } @else {
        Sign In
        }
      </button>
    </form>

    <!-- Social Sign In divider -->
    <div class="relative my-6 text-center">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-[#D5EDED]"></div>
      </div>
      <span class="relative bg-white px-3 text-xs text-[#4E6770]">or continue with</span>
    </div>

    <div>
      <button type="button" (click)="onGoogleSignIn()"
        class="w-full flex items-center justify-center py-2.5 px-3 border border-[#D5EDED] rounded-xl text-xs font-semibold text-[#172B32] hover:bg-[#F8FBFA] hover:border-[#71C9CE] transition-colors shadow-2xs cursor-pointer">
        <svg class="w-4 h-4 mr-2" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        Continue with Google
      </button>
    </div>

    <!-- Toggle Sign In / Sign Up -->
    <div class="mt-6 text-center text-xs text-[#4E6770]">
      Don't have an account?
      <a routerLink="/candidate/signup" class="font-bold text-[#244653] hover:text-[#71C9CE] ml-1">
        Sign Up
      </a>
    </div>

  </div>
</div>
