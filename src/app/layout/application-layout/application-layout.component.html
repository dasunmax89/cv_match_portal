<div class="layout-container">
  <!-- Top Global Loading Bar -->
  <div *ngIf="loadingService.isLoading()" class="global-progress-bar">
    <div class="progress-bar-value"></div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="mobile-toggle" (click)="toggleSidebar()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="brand">
        <span class="brand-badge">APP</span>
        <span class="brand-title">{{ 'APP_TITLE' | translate }}</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Language Switcher -->
      <div class="lang-picker">
        <button 
          type="button" 
          class="lang-btn" 
          [class.active]="translationService.currentLang() === 'en'"
          (click)="setLang('en')"
        >EN</button>
        <button 
          type="button" 
          class="lang-btn" 
          [class.active]="translationService.currentLang() === 'nl'"
          (click)="setLang('nl')"
        >NL</button>
      </div>

      <!-- User Badge -->
      <div class="user-profile-badge">
        <div class="avatar-circle">A</div>
        <span class="user-name">{{ 'LOGGED_IN_AS' | translate }}</span>
      </div>

      <!-- Logout -->
      <button type="button" class="btn-logout" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>{{ 'LOGOUT' | translate }}</span>
      </button>
    </div>
  </header>

  <div class="main-body">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" [class.open]="sidebarOpen">
      <nav class="nav-menu">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>{{ 'NAV_DASHBOARD' | translate }}</span>
        </a>
      </nav>
    </aside>

    <!-- Page Content Router Outlet -->
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
