<div class="layout-container">
  <!-- Top Global Loading Bar -->
  <div *ngIf="loadingService.isLoading()" class="global-progress-bar">
    <div class="progress-bar-value"></div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="mobile-toggle" (click)="toggleSidebar()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="brand">
        <span class="brand-badge">APP</span>
        <span class="brand-title">{{ 'APP_TITLE' | translate }}</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Language Switcher -->
      <div class="lang-picker">
        <button 
          type="button" 
          class="lang-btn" 
          [class.active]="translationService.currentLang() === 'en'"
          (click)="setLang('en')"
        >EN</button>
        <button 
          type="button" 
          class="lang-btn" 
          [class.active]="translationService.currentLang() === 'nl'"
          (click)="setLang('nl')"
        >NL</button>
      </div>

      <!-- User Badge -->
      <div class="user-profile-badge">
        <div class="avatar-circle">A</div>
        <span class="user-name">{{ 'LOGGED_IN_AS' | translate }}</span>
      </div>

      <!-- Logout -->
      <button type="button" class="btn-logout" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>{{ 'LOGOUT' | translate }}</span>
      </button>
    </div>
  </header>

  <div class="main-body">
    <aside class="app-sidebar" [class.open]="sidebarOpen">
      <nav class="nav-menu">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Dashboard</span>
        </a>
        <a routerLink="/recruiter/jobs" routerLinkActive="active" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          <span>Recruiter Jobs</span>
        </a>
        <a routerLink="/recruiter/create" routerLinkActive="active" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Create Requisition</span>
        </a>
        <a routerLink="/apply" routerLinkActive="active" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <polyline points="17 11 19 13 23 9"></polyline>
          </svg>
          <span>Candidate Board</span>
        </a>
      </nav>
    </aside>

    <!-- Page Content Router Outlet -->
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
