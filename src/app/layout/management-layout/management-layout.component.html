<div class="min-h-screen bg-[#F8FBFA] flex flex-col font-sans text-[#172B32]">
  <!-- Minimalist Light Vendor Admin Header -->
  <header class="bg-white border-b border-[#D5EDED] sticky top-0 z-50 shadow-2xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

      <!-- Brand Logo & Super Admin Label -->
      <div class="flex items-center space-x-3">
        <a routerLink="/management" class="flex items-center space-x-2.5 group">
          <img src="logo.png" alt="Magic Match Logo" class="w-18 h-18 object-contain group-hover:scale-105 transition-transform" />
          <div class="flex flex-col">
            <span class="font-bold text-[#172B32] leading-none text-lg tracking-tight">Magic Match</span>
            <span class="text-[10px] font-bold text-[#71C9CE] uppercase tracking-widest leading-none mt-0.5">Vendor Admin Portal</span>
          </div>
        </a>

        <!-- Admin Nav Links -->
        <nav class="hidden md:flex items-center space-x-1 ml-8">
          <a routerLink="/management/dashboard" routerLinkActive="bg-[#CBF1F5] text-[#244653] font-bold shadow-2xs"
            class="px-3.5 py-2 rounded-lg text-sm font-medium text-[#4E6770] hover:text-[#244653] hover:bg-[#E3FDFD]/60 transition-colors">
            Recruiter Accounts
          </a>
          <a routerLink="/management/placements" routerLinkActive="bg-[#CBF1F5] text-[#244653] font-bold shadow-2xs"
            class="px-3.5 py-2 rounded-lg text-sm font-medium text-[#4E6770] hover:text-[#244653] hover:bg-[#E3FDFD]/60 transition-colors">
            Placements & Commission
          </a>
        </nav>
      </div>

      <!-- Right Actions & System Status Pill -->
      <div class="flex items-center space-x-4">
        <!-- System Health Pill -->
        <div
          class="hidden md:flex items-center space-x-2 px-3 py-1 bg-[#CBF1F5] border border-[#71C9CE] rounded-full text-xs font-bold text-[#244653]">
          <span class="w-2 h-2 rounded-full bg-[#71C9CE] animate-pulse"></span>
          <span>Engine Operational</span>
        </div>

        @if (authService.isManagementLoggedIn()) {
        <div class="flex items-center space-x-3">
          <span class="text-xs font-semibold text-[#172B32]">{{ authService.managementUser()?.adminId }}</span>
          <button (click)="authService.logoutManagement()"
            class="px-3 py-1.5 text-xs font-medium text-[#244653] hover:text-white bg-[#E3FDFD] hover:bg-[#244653] border border-[#A6E3E9] rounded-lg transition-colors cursor-pointer">
            Sign Out
          </button>
        </div>
        } @else {
        <a routerLink="/management/login"
          class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold text-[#244653] bg-[#CBF1F5] hover:bg-[#A6E3E9] rounded-lg border border-[#71C9CE] transition-colors">
          Admin Login
        </a>
        }
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Minimalist Management Footer -->
  <footer class="bg-white border-t border-[#D5EDED] py-6">
    <div class="max-w-7xl mx-auto px-4 text-center sm:flex sm:justify-between sm:text-left text-xs text-[#4E6770]">
      <p>&copy; 2026 Magic Match Inc. Vendor Management Console.</p>
      <div class="mt-2 sm:mt-0 space-x-4">
        <a href="#" class="hover:text-[#244653]">System Logs</a>
        <a href="#" class="hover:text-[#244653]">Audit Trail</a>
        <a href="#" class="hover:text-[#244653]">Security Policy</a>
      </div>
    </div>
  </footer>
</div>
